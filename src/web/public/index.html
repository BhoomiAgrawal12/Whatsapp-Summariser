<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WA Summarizer</title>
<style>
  :root {
    --bg: #0b141a; --panel: #111b21; --panel2: #202c33; --text: #e9edef;
    --muted: #8696a0; --accent: #00a884; --accent2: #005c4b; --danger: #f15c6d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--panel2); padding: 12px 16px; display: flex; gap: 12px;
           align-items: center; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  nav button { background: transparent; color: var(--muted); border: 0; padding: 8px 12px;
               border-radius: 8px; cursor: pointer; font-size: 14px; }
  nav button.active { background: var(--accent2); color: var(--text); }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .card { background: var(--panel); border: 1px solid #22303a; border-radius: 12px;
          padding: 14px 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .muted { color: var(--muted); font-size: 13px; }
  button.primary { background: var(--accent); color: #06251e; border: 0; padding: 8px 14px;
                   border-radius: 8px; font-weight: 600; cursor: pointer; }
  /* Applies to <a class="ghost"> as well as <button class="ghost">. Scoping this to
     `button` left every ghost LINK unstyled, so it rendered as the browser's default
     blue underline — unreadable on this dark background. */
  .ghost { display: inline-block; background: var(--panel2); color: var(--text); border: 0;
           padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
           text-decoration: none; line-height: 1.4; }
  a.ghost { border: 1px solid #33434e; }
  .ghost:hover { background: #2a3942; color: #fff; }
  a.ghost:hover { border-color: var(--accent); }
  input, textarea { background: var(--panel2); border: 1px solid #33434e; color: var(--text);
                    border-radius: 8px; padding: 8px 10px; font: inherit; }
  textarea { width: 100%; min-height: 70px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .digest { white-space: pre-wrap; word-wrap: break-word; }
  .digest a.cite { color: var(--accent); text-decoration: none; font-weight: 600; }
  .digest a.cite:hover { text-decoration: underline; }
  .digest a.jump { color: var(--muted); text-decoration: none; font-size: 12px; margin-left: 1px; }
  .digest a.jump:hover { color: var(--accent); }
  .presets button { font-size: 13px; }
  label.muted { display: inline-flex; align-items: center; gap: 6px; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none;
           align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #modal.open { display: flex; }
  #modal .box { background: var(--panel); border-radius: 14px; max-width: 640px; width: 100%;
                max-height: 80vh; overflow-y: auto; padding: 16px; }
  .msg { padding: 8px 10px; border-radius: 10px; margin: 6px 0; background: var(--panel2); }
  .msg.target { outline: 2px solid var(--accent); }
  .msg .who { color: var(--accent); font-size: 13px; font-weight: 600; }
  .msg .when { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .msg-head { display: flex; align-items: baseline; gap: 4px; }
  /* Pushed to the right and kept quiet on every row except the cited one, which
     spells the action out. Previously each row carried a full-width labelled link,
     which buried the messages themselves. */
  .msg-head .open-wa { margin-left: auto; color: var(--muted); text-decoration: none;
                       font-size: 12px; white-space: nowrap; padding: 2px 6px; border-radius: 6px; }
  .msg-head .open-wa:hover { color: var(--accent); background: #2a3942; }
  .msg.target .open-wa { color: var(--accent); border: 1px solid var(--accent); }
  .starred-media img { max-width: 100%; border-radius: 10px; margin-top: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .spin { display: inline-block; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>🟢 WA Summarizer</h1>
  <nav id="tabs"></nav>
</header>
<main id="view"></main>

<div id="modal"><div class="box" id="modal-box"></div></div>

<script>
'use strict';
const TABS = [['groups','Groups'],['summaries','Summaries'],['starred','Starred ⭐'],['settings','Topics & Schedules']];
/** One-click windows — the value is a phrase the server parses (same grammar as /sum). */
const PRESETS = [
  ['today', 'Today'],
  ['yesterday', 'Yesterday'],
  ['24h', 'Last 24h'],
  ['3d', 'Last 3 days'],
  ['this week', 'This week'],
  ['last week', 'Last week'],
];
let activeTab = 'groups';

const $view = document.getElementById('view');
const $tabs = document.getElementById('tabs');
const $modal = document.getElementById('modal');
const $modalBox = document.getElementById('modal-box');
$modal.addEventListener('click', (e) => { if (e.target === $modal) $modal.classList.remove('open'); });

const api = async (path, opts) => {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
};
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (ts) => ts ? new Date(ts).toLocaleString([], {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '—';

function renderTabs() {
  $tabs.innerHTML = TABS.map(([id, label]) =>
    `<button class="${id === activeTab ? 'active' : ''}" data-tab="${id}">${label}</button>`).join('');
  $tabs.querySelectorAll('button').forEach((b) =>
    b.addEventListener('click', () => { activeTab = b.dataset.tab; render(); }));
}

/**
 * Digest text -> HTML with *bold*, _italic_ and clickable [n] citations.
 * Each citation gets two affordances: the number opens the in-dashboard context
 * view, and the ↗ hands the exact message to the Chrome extension.
 */
function digestHtml(content, citations, chatName) {
  const byN = Object.fromEntries((citations || []).map((c) => [String(c.n), c]));
  let html = esc(content);
  html = html.replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/_([^_\n]+)_/g, '<i>$1</i>');
  html = html.replace(/\[(\d+)\]/g, (m, n) => {
    const c = byN[n];
    if (!c) return m;
    const jump = c.waMessageId
      ? `<a class="jump" title="Open this exact message in WhatsApp Web" target="_blank" rel="noopener"
           href="${wwebJumpUrl({ chatJid: c.chatJid, waMessageId: c.waMessageId, chatName,
                                timestamp: c.timestamp, text: c.snippet, senderName: c.senderName })}">↗</a>`
      : '';
    return `<a href="#" class="cite" data-mid="${c.messageId}">[${n}]</a>${jump}`;
  });
  return html;
}

/**
 * Deep link handled by the companion Chrome extension on web.whatsapp.com.
 * The payload carries more than the id on purpose: `ts`/`text`/`sender` let the
 * extension find the message through WhatsApp's own search (and verify it
 * landed on the right one) when the id is not in the rendered DOM.
 */
function wwebJumpUrl(m) {
  const payload = encodeURIComponent(JSON.stringify({
    jid: m.chatJid || '',
    id: m.waMessageId || '',
    name: m.chatName || '',
    ts: m.timestamp || 0,
    text: (m.text || '').slice(0, 80),
    sender: m.senderName || '',
  }));
  return `https://web.whatsapp.com/#wasum=${payload}`;
}

/** Opens the context view for one message id. */
async function showContext(messageId) {
  const { target, chatName, messages } = await api(`/api/context/${messageId}?radius=15`);
  $modalBox.innerHTML = `<h3>Message context <span class="muted">· ${esc(chatName)}</span></h3>` +
    messages.map((m) => `
      <div class="msg ${m.id === target ? 'target' : ''}">
        <div class="msg-head">
          <span class="who">${esc(m.senderName)}</span><span class="when">${fmt(m.timestamp)}${m.edited ? ' · edited' : ''}</span>
          <a class="open-wa" target="_blank" rel="noopener" title="Open this message in WhatsApp Web (needs the companion extension)"
             href="${wwebJumpUrl({ ...m, chatName })}">${m.id === target ? 'Open in WhatsApp Web ↗' : '↗'}</a>
        </div>
        <div>${esc(m.text || '(' + m.kind + ')')}</div>
      </div>`).join('');
  $modal.classList.add('open');
  $modalBox.querySelector('.target')?.scrollIntoView({ block: 'center' });
}

function wireCitations(root) {
  root.querySelectorAll('a.cite').forEach((a) => a.addEventListener('click', async (e) => {
    e.preventDefault();
    try {
      await showContext(a.dataset.mid);
    } catch (err) {
      $modalBox.innerHTML = `<h3>Message context</h3><div class="empty">❌ ${esc(err.message)}</div>`;
      $modal.classList.add('open');
    }
  }));
}

function summaryCard(s) {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <h3>${esc(s.chatName)} <span class="muted">#${s.id}</span></h3>
    <div class="muted">${fmt(s.fromTs)} → ${fmt(s.toTs)} · ${s.messageCount} messages · created ${fmt(s.createdAt)}</div>
    <div class="digest" style="margin-top:8px">${digestHtml(s.content, s.citations, s.chatName)}</div>`;
  wireCitations(div);
  return div;
}

async function render() {
  renderTabs();
  $view.innerHTML = '<div class="empty"><span class="spin">⏳</span> loading…</div>';
  try {
    if (activeTab === 'groups') await renderGroups();
    if (activeTab === 'summaries') await renderSummaries();
    if (activeTab === 'starred') await renderStarred();
    if (activeTab === 'settings') await renderSettings();
  } catch (err) {
    $view.innerHTML = `<div class="empty">❌ ${esc(err.message)}</div>`;
  }
}

async function renderGroups() {
  const groups = await api('/api/groups');
  $view.innerHTML = '';
  if (!groups.length) {
    $view.innerHTML = '<div class="empty">No groups recorded yet — they appear as messages arrive after pairing.</div>';
    return;
  }
  for (const g of groups) {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <h3>${esc(g.name || g.jid)}</h3>
      <div class="muted">${g.messageCount} messages · last ${fmt(g.lastMessageTs)}</div>
      <div class="row presets">
        ${PRESETS.map(([id, label]) => `<button class="ghost preset" data-window="${id}">${label}</button>`).join('')}
      </div>
      <div class="row">
        <label class="muted">from <input type="date" class="from"></label>
        <label class="muted">to <input type="date" class="to"></label>
        <label class="muted"><input type="checkbox" class="precise"> exact times</label>
        <button class="primary run">Summarize range</button>
        <span class="muted status"></span>
      </div>
      <div class="result"></div>`;

    const from = div.querySelector('.from');
    const to = div.querySelector('.to');
    const precise = div.querySelector('.precise');
    const status = div.querySelector('.status');
    const result = div.querySelector('.result');

    // "exact times" swaps the two date pickers for datetime pickers, keeping the
    // day the user already chose. Dates alone cover the FULL days server-side.
    precise.addEventListener('change', () => {
      for (const input of [from, to]) {
        const day = input.value ? input.value.slice(0, 10) : '';
        input.type = precise.checked ? 'datetime-local' : 'date';
        input.value = day ? (precise.checked ? `${day}T00:00` : day) : '';
      }
    });

    const summarize = async (body, describe) => {
      status.innerHTML = '<span class="spin">⏳</span> summarizing ' + describe + '…';
      result.innerHTML = '';
      try {
        const s = await api('/api/summarize', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ chatJid: g.jid, ...body }),
        });
        status.textContent = '';
        if (s.empty) { status.textContent = s.message || 'No messages in that range.'; return; }
        result.appendChild(summaryCard(s));
      } catch (err) { status.textContent = '❌ ' + err.message; }
    };

    div.querySelectorAll('.preset').forEach((b) =>
      b.addEventListener('click', () => summarize({ window: b.dataset.window }, b.textContent)));

    div.querySelector('.run').addEventListener('click', () => {
      if (!from.value && !to.value) { status.textContent = 'Pick at least one date.'; return; }
      // A date-only range is sent as a phrase so the server expands it to whole
      // days; mixing in a time switches to explicit millisecond bounds.
      if (!precise.checked) {
        const a = from.value || to.value;
        const b = to.value || from.value;
        return summarize({ window: `${a}..${b}` }, `${a} → ${b}`);
      }
      const fromTs = new Date(from.value || to.value).getTime();
      const toTs = new Date(to.value || from.value).getTime();
      return summarize({ fromTs, toTs }, 'that range');
    });
    $view.appendChild(div);
  }
}

async function renderSummaries() {
  const list = await api('/api/summaries?limit=50');
  $view.innerHTML = '';
  if (!list.length) { $view.innerHTML = '<div class="empty">No saved summaries yet.</div>'; return; }
  list.forEach((s) => $view.appendChild(summaryCard(s)));
}

async function renderStarred() {
  const list = await api('/api/starred');
  $view.innerHTML = '';
  if (!list.length) {
    $view.innerHTML = '<div class="empty">Nothing starred yet.<br>React ⭐ to any WhatsApp message to archive it here permanently.</div>';
    return;
  }
  for (const m of list) {
    const div = document.createElement('div');
    div.className = 'card';
    const isImage = m.mediaPath && /\.(jpg|png|webp)$/.test(m.mediaPath);
    div.innerHTML = `
      <h3>${esc(m.senderName)} <span class="muted">in ${esc(m.chatName)}</span></h3>
      <div class="muted">sent ${fmt(m.timestamp)} · starred ${fmt(m.starredAt)}</div>
      <div style="margin-top:6px">${esc(m.text || '(' + m.kind + ')')}</div>
      <div class="starred-media">
        ${isImage ? `<img src="/${m.mediaPath}" alt="starred media">`
                  : m.mediaPath ? `<a class="ghost" href="/${m.mediaPath}" download>Download ${m.kind}</a>` : ''}
      </div>
      <div style="margin-top:8px"><a class="ghost" target="_blank" rel="noopener"
        href="${wwebJumpUrl(m)}">Open in WhatsApp Web ↗</a></div>`;
    $view.appendChild(div);
  }
}

async function renderSettings() {
  const [profile, schedules, groups] = await Promise.all([
    api('/api/topics'), api('/api/schedules'), api('/api/groups'),
  ]);
  $view.innerHTML = '';

  const topics = document.createElement('div');
  topics.className = 'card';
  topics.innerHTML = `
    <h3>🎯 Topic profile</h3>
    <div class="muted">Every digest ends with a "Your topics" section matching these interests. Change any time.</div>
    <div class="row"><textarea placeholder="e.g. tech talks, AI tools, event updates, sticker packs">${esc(profile.interests || '')}</textarea></div>
    <div class="row"><button class="primary">Save</button><span class="muted status"></span></div>`;
  topics.querySelector('button').addEventListener('click', async () => {
    await api('/api/topics', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ interests: topics.querySelector('textarea').value.trim() }) });
    topics.querySelector('.status').textContent = '✓ saved';
  });
  $view.appendChild(topics);

  const sched = document.createElement('div');
  sched.className = 'card';
  const byJid = Object.fromEntries(schedules.map((s) => [s.chatJid, s.time]));
  sched.innerHTML = `<h3>⏰ Daily digests</h3>
    <div class="muted">Delivered to your "Message Yourself" chat at the given time.</div>` +
    groups.map((g) => `
      <div class="row" data-jid="${esc(g.jid)}">
        <span style="flex:1">${esc(g.name || g.jid)}</span>
        <input type="time" value="${byJid[g.jid] || ''}">
        <button class="ghost set">Set</button>
        <button class="ghost off">Off</button>
      </div>`).join('');
  sched.querySelectorAll('.row[data-jid]').forEach((row) => {
    const jid = row.dataset.jid;
    row.querySelector('.set').addEventListener('click', async () => {
      const time = row.querySelector('input').value;
      if (time) await api('/api/schedules', { method: 'POST',
        headers: { 'content-type': 'application/json' }, body: JSON.stringify({ chatJid: jid, time }) });
    });
    row.querySelector('.off').addEventListener('click', async () => {
      row.querySelector('input').value = '';
      await api('/api/schedules', { method: 'POST',
        headers: { 'content-type': 'application/json' }, body: JSON.stringify({ chatJid: jid, time: null }) });
    });
  });
  $view.appendChild(sched);
}

/**
 * "/m/<messageId>" — the link citations carry into WhatsApp. Open that message's
 * context straight away, on top of whichever tab was last active.
 */
async function openDeepLink() {
  const match = /^\/m\/(\d+)\/?$/.exec(location.pathname);
  if (!match) return;
  try {
    await showContext(match[1]);
  } catch (err) {
    $modalBox.innerHTML = `<h3>Message context</h3><div class="empty">❌ ${esc(err.message)}</div>`;
    $modal.classList.add('open');
  }
}

render().then(openDeepLink);
</script>
</body>
</html>
