<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WA Summarizer</title>
<style>
  :root {
    --bg: #0b141a; --panel: #111b21; --panel2: #202c33; --text: #e9edef;
    --muted: #8696a0; --accent: #00a884; --accent2: #005c4b; --danger: #f15c6d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--panel2); padding: 12px 16px; display: flex; gap: 12px;
           align-items: center; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  nav button { background: transparent; color: var(--muted); border: 0; padding: 8px 12px;
               border-radius: 8px; cursor: pointer; font-size: 14px; }
  nav button.active { background: var(--accent2); color: var(--text); }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .card { background: var(--panel); border: 1px solid #22303a; border-radius: 12px;
          padding: 14px 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .muted { color: var(--muted); font-size: 13px; }
  button.primary { background: var(--accent); color: #06251e; border: 0; padding: 8px 14px;
                   border-radius: 8px; font-weight: 600; cursor: pointer; }
  /* Applies to <a class="ghost"> as well as <button class="ghost">. Scoping this to
     `button` left every ghost LINK unstyled, so it rendered as the browser's default
     blue underline — unreadable on this dark background. */
  .ghost { display: inline-block; background: var(--panel2); color: var(--text); border: 0;
           padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
           text-decoration: none; line-height: 1.4; }
  a.ghost { border: 1px solid #33434e; }
  .ghost:hover { background: #2a3942; color: #fff; }
  a.ghost:hover { border-color: var(--accent); }
  input, textarea { background: var(--panel2); border: 1px solid #33434e; color: var(--text);
                    border-radius: 8px; padding: 8px 10px; font: inherit; }
  textarea { width: 100%; min-height: 70px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .digest { white-space: pre-wrap; word-wrap: break-word; }
  .digest a.cite { color: var(--accent); text-decoration: none; font-weight: 600; }
  .digest a.cite:hover { text-decoration: underline; }
  .digest a.jump { color: var(--muted); text-decoration: none; font-size: 12px; margin-left: 1px; }
  .digest a.jump:hover { color: var(--accent); }
  .presets button { font-size: 13px; }
  label.muted { display: inline-flex; align-items: center; gap: 6px; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none;
           align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #modal.open { display: flex; }
  #modal .box { background: var(--panel); border-radius: 14px; max-width: 640px; width: 100%;
                max-height: 80vh; overflow-y: auto; padding: 16px; }
  .msg { padding: 8px 10px; border-radius: 10px; margin: 6px 0; background: var(--panel2); }
  .msg.target { outline: 2px solid var(--accent); }
  .msg .who { color: var(--accent); font-size: 13px; font-weight: 600; }
  .msg .when { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .msg-head { display: flex; align-items: baseline; gap: 4px; }
  /* Pushed to the right and kept quiet on every row except the cited one, which
     spells the action out. Previously each row carried a full-width labelled link,
     which buried the messages themselves. */
  .msg-head .open-wa { margin-left: auto; color: var(--muted); text-decoration: none;
                       font-size: 12px; white-space: nowrap; padding: 2px 6px; border-radius: 6px; }
  .msg-head .open-wa:hover { color: var(--accent); background: #2a3942; }
  .msg.target .open-wa { color: var(--accent); border: 1px solid var(--accent); }
  .starred-media img { max-width: 100%; border-radius: 10px; margin-top: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  /* Sticky filter bar shared by every list tab. Sits under the header, which is
     itself sticky at 0, so it is offset by the header's height. */
  .toolbar { position: sticky; top: 52px; z-index: 4; display: flex; gap: 8px; flex-wrap: wrap;
             align-items: center; background: var(--bg); padding: 10px 0 12px; }
  .toolbar input[type="search"] { flex: 1 1 220px; min-width: 0; }
  .toolbar select { background: var(--panel2); border: 1px solid #33434e; color: var(--text);
                    border-radius: 8px; padding: 8px 10px; font: inherit; }
  .toolbar .count { flex-basis: 100%; }
  input[type="search"]::-webkit-search-cancel-button { filter: invert(0.6); }
  mark { background: var(--accent2); color: var(--text); border-radius: 3px; padding: 0 2px; }
  .section-heading { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em;
                     text-transform: uppercase; margin: 16px 2px 6px; }
  .section-heading:first-child { margin-top: 0; }
  .note-head { display: flex; align-items: flex-start; gap: 8px; }
  .note-head h3 { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .note-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .note-actions button { padding: 4px 8px; }
  .note-actions button[disabled] { opacity: .35; cursor: default; }
  /* Notes are plain text: keep the user's own line breaks without letting a
     long pasted digest blow out the layout. */
  .note-body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 8px; }
  .note .e-body { min-height: 160px; }
  .sched-row { border-bottom: 1px solid #1c2a33; padding-bottom: 8px; }
  .sched-name { flex: 1 1 180px; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
  /* Inside a card the toolbar must not stick to the viewport, or it floats over
     the card's own heading while scrolling. */
  .card .toolbar { position: static; padding-top: 4px; }
  /* Fades the tail of a long digest instead of cutting it mid-line. */
  .digest.clipped { max-height: 190px; overflow: hidden;
                    -webkit-mask-image: linear-gradient(#000 60%, transparent);
                    mask-image: linear-gradient(#000 60%, transparent); }
  .spin { display: inline-block; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>🟢 WA Summarizer</h1>
  <nav id="tabs"></nav>
</header>
<main id="view"></main>

<div id="modal"><div class="box" id="modal-box"></div></div>

<script>
'use strict';
const TABS = [['groups','Groups'],['summaries','Summaries'],['notes','Notes 📝'],['starred','Starred ⭐'],['settings','Topics & Schedules']];
/** One-click windows — the value is a phrase the server parses (same grammar as /sum). */
const PRESETS = [
  ['today', 'Today'],
  ['yesterday', 'Yesterday'],
  ['24h', 'Last 24h'],
  ['3d', 'Last 3 days'],
  ['this week', 'This week'],
  ['last week', 'Last week'],
];
let activeTab = 'groups';

const $view = document.getElementById('view');
const $tabs = document.getElementById('tabs');
const $modal = document.getElementById('modal');
const $modalBox = document.getElementById('modal-box');
$modal.addEventListener('click', (e) => { if (e.target === $modal) $modal.classList.remove('open'); });

const api = async (path, opts) => {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
};
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (ts) => ts ? new Date(ts).toLocaleString([], {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '—';

function renderTabs() {
  $tabs.innerHTML = TABS.map(([id, label]) =>
    `<button class="${id === activeTab ? 'active' : ''}" data-tab="${id}">${label}</button>`).join('');
  $tabs.querySelectorAll('button').forEach((b) =>
    b.addEventListener('click', () => { activeTab = b.dataset.tab; render(); }));
}

/**
 * Digest text -> HTML with *bold*, _italic_ and clickable [n] citations.
 * Each citation gets two affordances: the number opens the in-dashboard context
 * view, and the ↗ hands the exact message to the Chrome extension.
 */
function digestHtml(content, citations, chatName) {
  const byN = Object.fromEntries((citations || []).map((c) => [String(c.n), c]));
  let html = esc(content);
  html = html.replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/_([^_\n]+)_/g, '<i>$1</i>');
  html = html.replace(/\[(\d+)\]/g, (m, n) => {
    const c = byN[n];
    if (!c) return m;
    const jump = c.waMessageId
      ? `<a class="jump" title="Open this exact message in WhatsApp Web" target="_blank" rel="noopener"
           href="${wwebJumpUrl({ chatJid: c.chatJid, waMessageId: c.waMessageId, chatName,
                                timestamp: c.timestamp, text: c.snippet, senderName: c.senderName })}">↗</a>`
      : '';
    return `<a href="#" class="cite" data-mid="${c.messageId}">[${n}]</a>${jump}`;
  });
  return html;
}

/**
 * Deep link handled by the companion Chrome extension on web.whatsapp.com.
 * The payload carries more than the id on purpose: `ts`/`text`/`sender` let the
 * extension find the message through WhatsApp's own search (and verify it
 * landed on the right one) when the id is not in the rendered DOM.
 */
function wwebJumpUrl(m) {
  const payload = encodeURIComponent(JSON.stringify({
    jid: m.chatJid || '',
    id: m.waMessageId || '',
    name: m.chatName || '',
    ts: m.timestamp || 0,
    text: (m.text || '').slice(0, 80),
    sender: m.senderName || '',
  }));
  return `https://web.whatsapp.com/#wasum=${payload}`;
}

/** Opens the context view for one message id. */
async function showContext(messageId) {
  const { target, chatName, messages } = await api(`/api/context/${messageId}?radius=15`);
  $modalBox.innerHTML = `<h3>Message context <span class="muted">· ${esc(chatName)}</span></h3>` +
    messages.map((m) => `
      <div class="msg ${m.id === target ? 'target' : ''}">
        <div class="msg-head">
          <span class="who">${esc(m.senderName)}</span><span class="when">${fmt(m.timestamp)}${m.edited ? ' · edited' : ''}</span>
          <a class="open-wa" target="_blank" rel="noopener" title="Open this message in WhatsApp Web (needs the companion extension)"
             href="${wwebJumpUrl({ ...m, chatName })}">${m.id === target ? 'Open in WhatsApp Web ↗' : '↗'}</a>
        </div>
        <div>${esc(m.text || '(' + m.kind + ')')}</div>
      </div>`).join('');
  $modal.classList.add('open');
  $modalBox.querySelector('.target')?.scrollIntoView({ block: 'center' });
}

function wireCitations(root) {
  root.querySelectorAll('a.cite').forEach((a) => a.addEventListener('click', async (e) => {
    e.preventDefault();
    try {
      await showContext(a.dataset.mid);
    } catch (err) {
      $modalBox.innerHTML = `<h3>Message context</h3><div class="empty">❌ ${esc(err.message)}</div>`;
      $modal.classList.add('open');
    }
  }));
}

/** Digests longer than this are collapsed so a list of them stays scannable. */
const DIGEST_COLLAPSE_CHARS = 700;

function summaryCard(s, needle) {
  const div = document.createElement('div');
  div.className = 'card';
  const long = (s.content || '').length > DIGEST_COLLAPSE_CHARS;
  div.innerHTML = `
    <h3>${highlight(s.chatName, needle)} <span class="muted">#${s.id}</span></h3>
    <div class="muted">${fmt(s.fromTs)} → ${fmt(s.toTs)} · ${s.messageCount} messages · created ${fmt(s.createdAt)}</div>
    <div class="digest${long ? ' clipped' : ''}" style="margin-top:8px">${digestHtml(s.content, s.citations, s.chatName)}</div>
    <div class="row">
      ${long ? '<button class="ghost expand">Show more ▾</button>' : ''}
      <button class="ghost to-note" title="Start a note from this digest">📝 Save as note</button>
      <span class="muted note-status"></span>
    </div>`;

  // Seed a note with the digest so it can be rewritten in the user's own words,
  // rather than making them copy it across by hand.
  div.querySelector('.to-note').addEventListener('click', async () => {
    const status = div.querySelector('.note-status');
    status.textContent = 'saving…';
    try {
      await api('/api/notes', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          title: `${s.chatName} — ${fmt(s.fromTs)} → ${fmt(s.toTs)}`,
          body: s.content,
          chatJid: s.chatJid,
          source: `from summary #${s.id}`,
        }),
      });
      status.textContent = '✓ saved to Notes — edit it there';
    } catch (err) {
      status.textContent = '❌ ' + err.message;
    }
  });

  if (long) {
    const body = div.querySelector('.digest');
    const button = div.querySelector('.expand');
    button.addEventListener('click', () => {
      const clipped = body.classList.toggle('clipped');
      button.textContent = clipped ? 'Show more ▾' : 'Show less ▴';
    });
  }
  wireCitations(div);
  return div;
}

/** Cap on cards rendered at once — hundreds of chats would otherwise crawl. */
const LIST_LIMIT = 40;

/**
 * Normalize text for searching — lowercase, accents folded, zero-width marks
 * dropped, whitespace collapsed — while recording which source index each
 * normalized character came from.
 *
 * The map matters: normalization changes length, so an offset found in the
 * normalized string cannot be used to slice the original. Without it,
 * highlighting a match in a name containing a zero-width character or a double
 * space marks the wrong characters.
 */
function normalizeWithMap(text) {
  const source = text || '';
  let out = '';
  const map = [];
  let lastWasSpace = true; // leading whitespace is dropped, like trim()

  for (let i = 0; i < source.length; i++) {
    const folded = source[i]
      .toLowerCase()
      .normalize('NFD')
      .replace(/[̀-ͯ​-‏⁠﻿]/g, '');
    if (!folded) continue;

    if (/^\s+$/.test(folded)) {
      if (lastWasSpace) continue;
      out += ' ';
      map.push(i);
      lastWasSpace = true;
      continue;
    }
    lastWasSpace = false;
    for (const ch of folded) {
      out += ch;
      map.push(i);
    }
  }
  while (out.endsWith(' ')) {
    out = out.slice(0, -1);
    map.pop();
  }
  return { text: out, map };
}

/** Search text compared with case, accents and emoji noise removed. */
function normalizeQuery(text) {
  return normalizeWithMap(text).text;
}

/** Search query per tab, so switching tabs and back doesn't lose it. */
const filterState = {};

/**
 * Render a searchable, optionally sortable list into the main view.
 *
 * Every list tab uses this so search behaves identically everywhere, and so a
 * large account (hundreds of groups) stays responsive: only LIST_LIMIT cards are
 * built at a time, and the count says plainly when results are being held back.
 *
 * @param {object}   o
 * @param {Array}    o.items        rows to show
 * @param {string}   o.key          filterState key (usually the tab id)
 * @param {string}   o.placeholder  search box placeholder
 * @param {Array}    [o.sorts]      [id, label, comparator][] — first is the default
 * @param {Function} o.searchText   item -> the string to match against
 * @param {Function} o.renderItem   item -> HTMLElement
 * @param {string}   o.emptyText    shown when there are no items at all
 * @param {string}   o.noun         plural noun for the count ("groups", "summaries")
 */
function filterableList(o) {
  // Defaults to the whole view; `mount` lets a tab embed a filtered list inside
  // a card alongside other content (Topics & Schedules does this).
  const root = o.mount || $view;
  root.innerHTML = '';
  if (!o.items.length) {
    root.innerHTML = `<div class="empty">${esc(o.emptyText)}</div>`;
    return;
  }

  const sorts = o.sorts || [];
  const state = (filterState[o.key] = filterState[o.key] || { query: '', sort: sorts[0]?.[0] || '' });

  const bar = document.createElement('div');
  bar.className = 'toolbar';
  bar.innerHTML = `
    <input type="search" class="search" placeholder="${esc(o.placeholder)}" value="${esc(state.query)}" autocomplete="off">
    ${sorts.length ? `<select class="sort" title="Sort order">${sorts
      .map(([id, label]) => `<option value="${esc(id)}"${id === state.sort ? ' selected' : ''}>${esc(label)}</option>`)
      .join('')}</select>` : ''}
    <span class="muted count"></span>`;

  const list = document.createElement('div');
  root.append(bar, list);

  const $search = bar.querySelector('.search');
  const $sort = bar.querySelector('.sort');
  const $count = bar.querySelector('.count');

  const apply = () => {
    state.query = $search.value;
    if ($sort) state.sort = $sort.value;

    const needle = normalizeQuery(state.query);
    const matched = needle
      ? o.items.filter((item) => normalizeQuery(o.searchText(item)).includes(needle))
      : o.items.slice();

    const comparator = sorts.find(([id]) => id === state.sort)?.[2];
    if (comparator) matched.sort(comparator);

    const shown = matched.slice(0, LIST_LIMIT);
    list.innerHTML = '';
    // Optional section headings (e.g. group results by day). A heading is
    // emitted whenever the caller's label changes between consecutive rows.
    let lastHeading = null;
    for (const item of shown) {
      const heading = o.groupHeading?.(item, state.sort) ?? null;
      if (heading !== null && heading !== lastHeading) {
        const h = document.createElement('div');
        h.className = 'section-heading';
        h.textContent = heading;
        list.appendChild(h);
        lastHeading = heading;
      }
      list.appendChild(o.renderItem(item, needle));
    }

    if (matched.length === 0) {
      list.innerHTML = `<div class="empty">Nothing matches “${esc(state.query.trim())}”.</div>`;
      $count.textContent = '';
    } else if (matched.length > shown.length) {
      // Never silently truncate: say what is being held back and why.
      $count.textContent = `showing ${shown.length} of ${matched.length} ${o.noun} — search to narrow it down`;
    } else {
      $count.textContent = `${matched.length} ${o.noun}`;
    }
  };

  $search.addEventListener('input', apply);
  $sort?.addEventListener('change', apply);
  apply();
}

/**
 * Wrap the first match of an already-normalized `needle` in <mark>.
 * Escapes first, then maps the match position back through normalization, so
 * the marked characters are the ones that actually matched.
 */
function highlight(text, needle) {
  const safe = esc(text);
  if (!needle) return safe;
  const { text: normalized, map } = normalizeWithMap(safe);
  const at = normalized.indexOf(needle);
  if (at === -1) return safe;
  const start = map[at] ?? 0;
  const end = at + needle.length < map.length ? map[at + needle.length] : safe.length;
  return `${safe.slice(0, start)}<mark>${safe.slice(start, end)}</mark>${safe.slice(end)}`;
}

async function render() {
  renderTabs();
  $view.innerHTML = '<div class="empty"><span class="spin">⏳</span> loading…</div>';
  try {
    if (activeTab === 'groups') await renderGroups();
    if (activeTab === 'summaries') await renderSummaries();
    if (activeTab === 'notes') await renderNotes();
    if (activeTab === 'starred') await renderStarred();
    if (activeTab === 'settings') await renderSettings();
  } catch (err) {
    $view.innerHTML = `<div class="empty">❌ ${esc(err.message)}</div>`;
  }
}

async function renderGroups() {
  const groups = await api('/api/groups');
  filterableList({
    items: groups,
    key: 'groups',
    placeholder: 'Search groups by name…',
    noun: 'groups',
    emptyText: 'No groups recorded yet — they appear as messages arrive after pairing.',
    searchText: (g) => g.name || g.jid,
    sorts: [
      ['recent', 'Most recent activity', (a, b) => (b.lastMessageTs || 0) - (a.lastMessageTs || 0)],
      ['name', 'Name (A–Z)', (a, b) => (a.name || a.jid).localeCompare(b.name || b.jid)],
      ['messages', 'Most messages', (a, b) => b.messageCount - a.messageCount],
    ],
    renderItem: (g, needle) => groupCard(g, needle),
  });
}

function groupCard(g, needle) {
  {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <h3>${highlight(g.name || g.jid, needle)}</h3>
      <div class="muted">${g.messageCount} messages · last ${fmt(g.lastMessageTs)}</div>
      <div class="row presets">
        ${PRESETS.map(([id, label]) => `<button class="ghost preset" data-window="${id}">${label}</button>`).join('')}
      </div>
      <div class="row">
        <label class="muted">from <input type="date" class="from"></label>
        <label class="muted">to <input type="date" class="to"></label>
        <label class="muted"><input type="checkbox" class="precise"> exact times</label>
        <button class="primary run">Summarize range</button>
        <span class="muted status"></span>
      </div>
      <div class="result"></div>`;

    const from = div.querySelector('.from');
    const to = div.querySelector('.to');
    const precise = div.querySelector('.precise');
    const status = div.querySelector('.status');
    const result = div.querySelector('.result');

    // "exact times" swaps the two date pickers for datetime pickers, keeping the
    // day the user already chose. Dates alone cover the FULL days server-side.
    precise.addEventListener('change', () => {
      for (const input of [from, to]) {
        const day = input.value ? input.value.slice(0, 10) : '';
        input.type = precise.checked ? 'datetime-local' : 'date';
        input.value = day ? (precise.checked ? `${day}T00:00` : day) : '';
      }
    });

    const summarize = async (body, describe) => {
      status.innerHTML = '<span class="spin">⏳</span> summarizing ' + describe + '…';
      result.innerHTML = '';
      try {
        const s = await api('/api/summarize', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ chatJid: g.jid, ...body }),
        });
        status.textContent = '';
        if (s.empty) { status.textContent = s.message || 'No messages in that range.'; return; }
        result.appendChild(summaryCard(s));
      } catch (err) { status.textContent = '❌ ' + err.message; }
    };

    div.querySelectorAll('.preset').forEach((b) =>
      b.addEventListener('click', () => summarize({ window: b.dataset.window }, b.textContent)));

    div.querySelector('.run').addEventListener('click', () => {
      if (!from.value && !to.value) { status.textContent = 'Pick at least one date.'; return; }
      // A date-only range is sent as a phrase so the server expands it to whole
      // days; mixing in a time switches to explicit millisecond bounds.
      if (!precise.checked) {
        const a = from.value || to.value;
        const b = to.value || from.value;
        return summarize({ window: `${a}..${b}` }, `${a} → ${b}`);
      }
      const fromTs = new Date(from.value || to.value).getTime();
      const toTs = new Date(to.value || from.value).getTime();
      return summarize({ fromTs, toTs }, 'that range');
    });
    return div;
  }
}

async function renderSummaries() {
  const list = await api('/api/summaries?limit=300');
  filterableList({
    items: list,
    key: 'summaries',
    placeholder: 'Search summaries — group name or anything in the text…',
    noun: 'summaries',
    emptyText: 'No saved summaries yet. Every /sum result is saved automatically.',
    // Searching the digest body too makes this a way to find "what was said
    // about X", not merely a group picker.
    searchText: (s) => `${s.chatName} ${s.content}`,
    sorts: [
      ['newest', 'Newest first', (a, b) => b.createdAt - a.createdAt],
      ['oldest', 'Oldest first', (a, b) => a.createdAt - b.createdAt],
      ['covered', 'Period covered (latest)', (a, b) => b.fromTs - a.fromTs],
      ['group', 'Group name (A–Z)', (a, b) => a.chatName.localeCompare(b.chatName) || b.createdAt - a.createdAt],
      ['size', 'Most messages', (a, b) => b.messageCount - a.messageCount],
    ],
    // Date-wise arrangement: day headings when ordered by time, group headings
    // when ordered by group.
    groupHeading: (s, sort) => {
      if (sort === 'group') return s.chatName || s.chatJid;
      if (sort === 'newest' || sort === 'oldest') return dayLabel(s.createdAt);
      if (sort === 'covered') return dayLabel(s.fromTs);
      return null;
    },
    renderItem: (s, needle) => summaryCard(s, needle),
  });
}

/* ------------------------------------------------------------------ Notes */

/** Loaded notes, kept in the user's chosen order so reordering is instant. */
let notes = [];

async function renderNotes() {
  notes = await api('/api/notes');
  $view.innerHTML = '';

  const composer = document.createElement('div');
  composer.className = 'card';
  composer.innerHTML = `
    <h3>📝 New note</h3>
    <div class="row"><input class="note-title" style="flex:1" placeholder="Title (optional)"></div>
    <div class="row"><textarea class="note-body" placeholder="Write it in your own words…"></textarea></div>
    <div class="row"><button class="primary add">Save note</button><span class="muted status"></span></div>`;

  const $title = composer.querySelector('.note-title');
  const $body = composer.querySelector('.note-body');
  const $status = composer.querySelector('.status');

  const add = async () => {
    if (!$title.value.trim() && !$body.value.trim()) {
      $status.textContent = 'Write something first.';
      return;
    }
    $status.textContent = 'saving…';
    try {
      await api('/api/notes', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ title: $title.value, body: $body.value }),
      });
      $title.value = '';
      $body.value = '';
      await renderNotes();
    } catch (err) {
      $status.textContent = '❌ ' + err.message;
    }
  };
  composer.querySelector('.add').addEventListener('click', () => void add());
  // Ctrl/Cmd+Enter saves, the usual shortcut for a compose box.
  $body.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') void add();
  });
  $view.appendChild(composer);

  const list = document.createElement('div');
  $view.appendChild(list);

  filterableList({
    mount: list,
    items: notes,
    key: 'notes',
    placeholder: 'Search your notes…',
    noun: 'notes',
    emptyText: 'No notes yet. Write one above, or use “Save as note” on any summary.',
    searchText: (n) => `${n.title} ${n.body} ${n.source}`,
    // No sort control: the whole point is the order the user arranged. The list
    // arrives from the server already in `position` order.
    renderItem: (n, needle) => noteCard(n, needle),
  });
}

function noteCard(note, needle) {
  const card = document.createElement('div');
  card.className = 'card note';
  const index = notes.findIndex((n) => n.id === note.id);

  const view = () => {
    card.innerHTML = `
      <div class="note-head">
        <h3>${note.title ? highlight(note.title, needle) : '<span class="muted">Untitled</span>'}</h3>
        <div class="note-actions">
          <button class="ghost up" title="Move up" ${index <= 0 ? 'disabled' : ''}>↑</button>
          <button class="ghost down" title="Move down" ${index >= notes.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="ghost edit">Edit</button>
          <button class="ghost del" title="Delete">🗑</button>
        </div>
      </div>
      <div class="muted">${note.source ? esc(note.source) + ' · ' : ''}updated ${fmt(note.updatedAt)}</div>
      <div class="note-body">${highlight(note.body, needle)}</div>`;

    card.querySelector('.edit').addEventListener('click', edit);
    card.querySelector('.up').addEventListener('click', () => void move(-1));
    card.querySelector('.down').addEventListener('click', () => void move(1));
    card.querySelector('.del').addEventListener('click', () => void remove());
  };

  const edit = () => {
    card.innerHTML = `
      <div class="row"><input class="e-title" style="flex:1" placeholder="Title (optional)" value="${esc(note.title)}"></div>
      <div class="row"><textarea class="e-body"></textarea></div>
      <div class="row"><button class="primary save">Save</button>
        <button class="ghost cancel">Cancel</button><span class="muted status"></span></div>`;
    // Set through .value, not an HTML attribute: a body containing "</textarea>"
    // would otherwise break out of the element.
    const $body = card.querySelector('.e-body');
    $body.value = note.body;

    card.querySelector('.cancel').addEventListener('click', view);
    card.querySelector('.save').addEventListener('click', async () => {
      const $status = card.querySelector('.status');
      $status.textContent = 'saving…';
      try {
        const updated = await api(`/api/notes/${note.id}`, {
          method: 'PUT',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ title: card.querySelector('.e-title').value, body: $body.value }),
        });
        Object.assign(note, updated);
        view();
      } catch (err) {
        $status.textContent = '❌ ' + err.message;
      }
    });
  };

  const remove = async () => {
    if (!confirm(`Delete "${note.title || 'this note'}"? This cannot be undone.`)) return;
    await api(`/api/notes/${note.id}`, { method: 'DELETE' });
    await renderNotes();
  };

  /** Swap with the neighbour and persist the whole order. */
  const move = async (delta) => {
    const from = notes.findIndex((n) => n.id === note.id);
    const to = from + delta;
    if (from === -1 || to < 0 || to >= notes.length) return;
    const reordered = notes.slice();
    [reordered[from], reordered[to]] = [reordered[to], reordered[from]];
    notes = await api('/api/notes/reorder', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ids: reordered.map((n) => n.id) }),
    });
    await renderNotes();
  };

  view();
  return card;
}

/** One group's daily-digest row, with immediate feedback on save. */
function scheduleRow(group, time, needle) {
  const row = document.createElement('div');
  row.className = 'row sched-row';
  row.innerHTML = `
    <span class="sched-name">${time ? '⏰ ' : ''}${highlight(group.name || group.jid, needle)}</span>
    <input type="time" value="${esc(time)}">
    <button class="ghost set">Set</button>
    <button class="ghost off">Off</button>
    <span class="muted status"></span>`;

  const $time = row.querySelector('input');
  const $status = row.querySelector('.status');
  const save = async (value) => {
    $status.textContent = '…';
    try {
      await api('/api/schedules', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ chatJid: group.jid, time: value }),
      });
      // Previously this fired and said nothing, so there was no way to tell a
      // saved schedule from a mis-click.
      $status.textContent = value ? `✓ daily at ${value}` : '✓ off';
    } catch (err) {
      $status.textContent = '❌ ' + err.message;
    }
  };

  row.querySelector('.set').addEventListener('click', () => {
    if (!$time.value) { $status.textContent = 'Pick a time first.'; return; }
    void save($time.value);
  });
  row.querySelector('.off').addEventListener('click', () => {
    $time.value = '';
    void save(null);
  });
  return row;
}

/** "Today" / "Yesterday" / "24 Sep 2026" for a section heading. */
function dayLabel(ts) {
  if (!ts) return 'Unknown date';
  const day = new Date(ts); day.setHours(0, 0, 0, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - day) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return new Date(ts).toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' });
}

async function renderStarred() {
  const list = await api('/api/starred');
  $view.innerHTML = '';
  if (!list.length) {
    $view.innerHTML = '<div class="empty">Nothing starred yet.<br>React ⭐ to any WhatsApp message to archive it here permanently.</div>';
    return;
  }
  for (const m of list) {
    const div = document.createElement('div');
    div.className = 'card';
    const isImage = m.mediaPath && /\.(jpg|png|webp)$/.test(m.mediaPath);
    div.innerHTML = `
      <h3>${esc(m.senderName)} <span class="muted">in ${esc(m.chatName)}</span></h3>
      <div class="muted">sent ${fmt(m.timestamp)} · starred ${fmt(m.starredAt)}</div>
      <div style="margin-top:6px">${esc(m.text || '(' + m.kind + ')')}</div>
      <div class="starred-media">
        ${isImage ? `<img src="/${m.mediaPath}" alt="starred media">`
                  : m.mediaPath ? `<a class="ghost" href="/${m.mediaPath}" download>Download ${m.kind}</a>` : ''}
      </div>
      <div style="margin-top:8px"><a class="ghost" target="_blank" rel="noopener"
        href="${wwebJumpUrl(m)}">Open in WhatsApp Web ↗</a></div>`;
    $view.appendChild(div);
  }
}

async function renderSettings() {
  const [profile, schedules, groups] = await Promise.all([
    api('/api/topics'), api('/api/schedules'), api('/api/groups'),
  ]);
  $view.innerHTML = '';

  const topics = document.createElement('div');
  topics.className = 'card';
  topics.innerHTML = `
    <h3>🎯 Topic profile</h3>
    <div class="muted">Every digest ends with a "Your topics" section matching these interests. Change any time.</div>
    <div class="row"><textarea placeholder="e.g. tech talks, AI tools, event updates, sticker packs">${esc(profile.interests || '')}</textarea></div>
    <div class="row"><button class="primary">Save</button><span class="muted status"></span></div>`;
  topics.querySelector('button').addEventListener('click', async () => {
    await api('/api/topics', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ interests: topics.querySelector('textarea').value.trim() }) });
    topics.querySelector('.status').textContent = '✓ saved';
  });
  $view.appendChild(topics);

  const sched = document.createElement('div');
  sched.className = 'card';
  const byJid = Object.fromEntries(schedules.map((s) => [s.chatJid, s.time]));
  sched.innerHTML = `<h3>⏰ Daily digests</h3>
    <div class="muted">Delivered to your "Message Yourself" chat at the given time.</div>
    <div class="sched-list"></div>`;

  filterableList({
    mount: sched.querySelector('.sched-list'),
    items: groups,
    key: 'schedules',
    placeholder: 'Search groups to schedule…',
    noun: 'groups',
    emptyText: 'No groups recorded yet.',
    searchText: (g) => g.name || g.jid,
    sorts: [
      // Groups that already have a digest come first: the common task here is
      // reviewing or turning off an existing schedule, not adding the 400th.
      ['scheduled', 'Scheduled first', (a, b) =>
        Number(Boolean(byJid[b.jid])) - Number(Boolean(byJid[a.jid])) ||
        (b.lastMessageTs || 0) - (a.lastMessageTs || 0)],
      ['recent', 'Most recent activity', (a, b) => (b.lastMessageTs || 0) - (a.lastMessageTs || 0)],
      ['name', 'Name (A–Z)', (a, b) => (a.name || a.jid).localeCompare(b.name || b.jid)],
    ],
    renderItem: (g, needle) => scheduleRow(g, byJid[g.jid] || '', needle),
  });

  $view.appendChild(sched);
}

/**
 * "/m/<messageId>" — the link citations carry into WhatsApp. Open that message's
 * context straight away, on top of whichever tab was last active.
 */
async function openDeepLink() {
  const match = /^\/m\/(\d+)\/?$/.exec(location.pathname);
  if (!match) return;
  try {
    await showContext(match[1]);
  } catch (err) {
    $modalBox.innerHTML = `<h3>Message context</h3><div class="empty">❌ ${esc(err.message)}</div>`;
    $modal.classList.add('open');
  }
}

render().then(openDeepLink);
</script>
